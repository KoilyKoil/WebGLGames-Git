<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | BacchusDrawCircle</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=2160 height=3840 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">BacchusDrawCircle</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var ASPECT = 9 / 16;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function fitPortraitCanvas() {
        var footer = document.querySelector("#unity-footer");
        var footerH = (footer && footer.offsetParent !== null) ? (footer.offsetHeight || 0) : 0;
        var maxW = Math.max(120, window.innerWidth);
        var maxH = Math.max(120, window.innerHeight - footerH);
        var width = maxW;
        var height = width / ASPECT;
        if (height > maxH) {
          height = maxH;
          width = height * ASPECT;
        }
        width = Math.floor(width);
        height = Math.floor(height);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        container.style.width = width + "px";
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/박카스_원그리기0.5.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/박카스_원그리기0.5.data",
        frameworkUrl: buildUrl + "/박카스_원그리기0.5.framework.js",
        codeUrl: buildUrl + "/박카스_원그리기0.5.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Bacchus0EventGame",
        productName: "BacchusDrawCircle",
        productVersion: "1.2",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };


      fitPortraitCanvas();
      window.addEventListener("resize", fitPortraitCanvas);
      window.addEventListener("orientationchange", fitPortraitCanvas);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                fitPortraitCanvas();
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
